<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Energy Booking & Reservations — Smart Solar Microgrid</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <a class="sidebar-brand d-flex align-items-center gap-2" href="#">
        <span class="logo-glow"><img src="assets/logo.svg" alt="SolarGrid logo" /></span>
        <span><strong>SolarGrid</strong></span>
      </a>
      <hr class="sidebar-divider" />
      <nav class="sidebar-nav">
        <button class="nav-item" data-module="dashboard">
          <i class="fa-solid fa-house"></i><span>Dashboard</span>
        </button>
        <button class="nav-item" data-module="users">
          <i class="fa-solid fa-users"></i><span>User Management</span>
        </button>
        <button class="nav-item" data-module="stations">
          <i class="fa-solid fa-solar-panel"></i><span>Solar Stations</span>
        </button>
        <button class="nav-item active" data-module="reservations" aria-current="page">
          <i class="fa-solid fa-clipboard-list"></i><span>Reservations</span>
        </button>
        <button class="nav-item" data-module="qr">
          <i class="fa-solid fa-qrcode"></i><span>QR Verification</span>
        </button>
        <button class="nav-item" data-module="profile">
          <i class="fa-solid fa-user"></i><span>Profile</span>
        </button>
        <button class="nav-item" data-module="about">
          <i class="fa-solid fa-circle-info"></i><span>About System</span>
        </button>
        <button class="nav-item" data-module="technology">
          <i class="fa-solid fa-microchip"></i><span>Technology</span>
        </button>
        <button class="nav-item" data-module="architecture">
          <i class="fa-solid fa-diagram-project"></i><span>Architecture</span>
        </button>
      </nav>
    </aside>

    <div class="content-wrap">
      <nav class="navbar navbar-expand topbar">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h6 fw-bold">Member 3 — Energy Booking & Reservation</span>
        </div>
      </nav>
      <main class="container py-4">
        <h1 class="page-title mb-2">Energy Reservations</h1>
        <p class="text-muted">Member 3 module placeholder ready with shared sidebar navigation.</p>
        <div class="alert alert-info">
          Use the shared sidebar to navigate to <strong>Solar Stations</strong> (Member 2) or <strong>QR Verification</strong> (Member 4).
        </div>
      </main>
    </div>
  </div>

  <script>
    document.querySelectorAll('.sidebar-nav .nav-item[data-module]').forEach(btn => {
      btn.addEventListener('click', () => {
        const mod = btn.dataset.module;
        if (mod === 'stations') window.location.href = '../SmartSolarStationUI/index.html';
        else if (mod === 'qr') window.location.href = '../SmartSolarFieldOpsUI/index.html';
        else if (mod === 'dashboard' || mod === 'users') window.location.href = '../SmartSolarUsersUI/index.html';
      });
    });
  </script>
</body>
</html>
