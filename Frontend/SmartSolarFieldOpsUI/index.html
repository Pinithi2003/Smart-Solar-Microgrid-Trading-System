<!-- Role-based access control -->
<script>
  const solarGridToken =
    localStorage.getItem("solarGridToken");

  const solarGridUserRaw =
    localStorage.getItem("solarGridUser");

  let solarGridUser = null;

  try {
    solarGridUser = solarGridUserRaw
      ? JSON.parse(solarGridUserRaw)
      : null;
  } catch (error) {
    solarGridUser = null;
  }

  /* =====================================================
     GET CURRENT USER ROLE
     ===================================================== */

  const currentRole =
    solarGridUser && solarGridUser.role
      ? solarGridUser.role.trim().toLowerCase()
      : "";


  /* =====================================================
     ALLOWED ROLES

     Backoffice   -> Allowed
     GridOperator -> Allowed
     Prosumer     -> Not Allowed
     ===================================================== */

  const allowedRoles = [
    "backoffice",
    "gridoperator"
  ];


  /* =====================================================
     CHECK LOGIN + ROLE
     ===================================================== */

  if (
    !solarGridToken ||
    !solarGridUser ||
    !allowedRoles.includes(currentRole)
  ) {

    window.location.replace("../index.html");

  } else {

    /* =================================================
       SHOW PAGE
       ================================================= */

    document.body.style.visibility = "visible";


    /* =================================================
       ROLE DISPLAY
       ================================================= */

    const roleLabel =
      currentRole === "backoffice"
        ? "Backoffice"
        : "Grid Operator";


    /* =================================================
       USER NAME
       ================================================= */

    const displayName =
      solarGridUser.fullName ||
      solarGridUser.name ||
      roleLabel;


    /* =================================================
       PROFILE AVATAR
       ================================================= */

    const profileAvatar =
      document.getElementById("profileAvatar");


    /* =================================================
       PROFILE NAME
       ================================================= */

    const profileName =
      document.getElementById("profileName");


    /* =================================================
       UPDATE AVATAR
       ================================================= */

    if (profileAvatar) {

      profileAvatar.textContent =
        currentRole === "backoffice"
          ? "BO"
          : "GO";

    }


    /* =================================================
       UPDATE USER NAME
       ================================================= */

    if (profileName) {

      profileName.textContent =
        displayName;

    }

  }
</script>
